<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平均取得単価計算ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: #252a32;
    --border-bright: #343d4a;
    --text: #f0f4f8;
    --text-muted: #9baabb;
    --text-dim: #5c6e80;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.15);
    --green: #22c55e;
    --green-glow: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-glow: rgba(239,68,68,0.12);
    --gold: #f59e0b;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-glow);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 100px;
    padding: 4px 14px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .header-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 400;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .card:hover {
    border-color: var(--border-bright);
  }

  .card-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .card-icon.blue { background: var(--accent-glow); color: var(--accent); }
  .card-icon.green { background: var(--green-glow); color: var(--green); }

  .card-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  .card-body {
    padding: 20px 24px 24px;
  }

  /* Input grid */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 520px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .input-wrap {
    position: relative;
  }

  input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 40px 10px 14px;
    font-size: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus {
    border-color: var(--accent);
    background: rgba(59,130,246,0.05);
  }

  .unit {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'Noto Sans JP', sans-serif;
    pointer-events: none;
  }

  /* Button */
  .calc-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .calc-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
  }

  .calc-btn:hover { opacity: 0.9; }
  .calc-btn:active { transform: scale(0.99); }

  /* Results */
  .results {
    display: none;
    animation: fadeUp 0.35s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .results.visible { display: block; }

  /* Stat rows */
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }

  .stat-row:last-child { border-bottom: none; }

  .stat-label {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .stat-label small {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .stat-value {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    font-weight: 500;
    text-align: right;
  }

  .stat-value.large {
    font-size: 20px;
    font-weight: 500;
  }

  .stat-value.accent { color: var(--accent); }

  .pnl-positive { color: var(--green); }
  .pnl-negative { color: var(--red); }

  /* Big highlight */
  .highlight-box {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .highlight-box .hl-label {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .highlight-box .hl-value {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  /* Change arrow */
  .change-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
  }

  .change-chip.up { background: var(--green-glow); color: var(--green); }
  .change-chip.down { background: var(--red-glow); color: var(--red); }
  .change-chip.neutral { background: rgba(107,122,141,0.12); color: var(--text-muted); }

  /* Divider */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 16px;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .section-divider::before, .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Reset */
  .reset-btn {
    width: 100%;
    padding: 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 8px;
    transition: border-color 0.2s, color 0.2s;
  }

  .reset-btn:hover { border-color: var(--border-bright); color: var(--text); }

  .footer-note {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="header-badge">Stock Calculator</div>
    <h1>平均取得単価<span>計算</span></h1>
    <p class="subtitle">買い増し後の平均コストと損益をシミュレーション</p>
  </div>

  <!-- 現在の保有情報 -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon blue">📊</div>
      <span class="card-title">現在の保有情報</span>
    </div>
    <div class="card-body">
      <div class="grid-3">
        <div class="field">
          <label>保有株数</label>
          <div class="input-wrap">
            <input type="number" id="holdShares" placeholder="100" min="0">
            <span class="unit">株</span>
          </div>
        </div>
        <div class="field">
          <label>平均取得単価</label>
          <div class="input-wrap">
            <input type="number" id="avgCost" placeholder="1500" min="0">
            <span class="unit">円</span>
          </div>
        </div>
        <div class="field">
          <label>現在値</label>
          <div class="input-wrap">
            <input type="number" id="currentPrice" placeholder="1800" min="0">
            <span class="unit">円</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 買い増し情報 -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon green">➕</div>
      <span class="card-title">買い増し情報</span>
    </div>
    <div class="card-body">
      <div class="grid-2">
        <div class="field">
          <label>買い増し株数</label>
          <div class="input-wrap">
            <input type="number" id="buyShares" placeholder="50" min="0">
            <span class="unit">株</span>
          </div>
        </div>
        <div class="field">
          <label>指値</label>
          <div class="input-wrap">
            <input type="number" id="limitPrice" placeholder="1600" min="0">
            <span class="unit">円</span>
          </div>
        </div>
      </div>
      <button class="calc-btn" onclick="calculate()">計算する</button>
    </div>
  </div>

  <!-- 結果 -->
  <div class="results" id="results">
    <div class="card">
      <div class="card-header">
        <div class="card-icon blue">📈</div>
        <span class="card-title">計算結果</span>
      </div>
      <div class="card-body">

        <div class="section-divider">買い増し前</div>

        <div class="stat-row">
          <div class="stat-label">
            評価損益
            <small>現在値 × 保有株数 − 取得コスト合計</small>
          </div>
          <div>
            <div class="stat-value large" id="beforePnl">—</div>
            <div style="text-align:right; margin-top:4px;">
              <span class="change-chip" id="beforePnlRate">—</span>
            </div>
          </div>
        </div>

        <div class="section-divider">買い増し後（指値約定時）</div>

        <!-- 新平均取得単価 ハイライト -->
        <div class="highlight-box">
          <div class="hl-label">
            新しい<br>平均取得単価
          </div>
          <div class="hl-value" id="newAvgCost">—</div>
        </div>

        <div class="stat-row">
          <div class="stat-label">
            取得コスト合計
            <small>（保有株数 + 買い増し株数）× 新平均単価</small>
          </div>
          <div class="stat-value accent" id="totalCost">—</div>
        </div>

        <div class="stat-row">
          <div class="stat-label">
            評価損益（現在値基準）
            <small>現在値 × 合計株数 − 新取得コスト</small>
          </div>
          <div>
            <div class="stat-value large" id="afterPnl">—</div>
            <div style="text-align:right; margin-top:4px;">
              <span class="change-chip" id="afterPnlRate">—</span>
            </div>
          </div>
        </div>

        <div class="stat-row">
          <div class="stat-label">
            損益分岐点
            <small>この価格以上で含み益</small>
          </div>
          <div class="stat-value" id="breakEven">—</div>
        </div>

        <div class="stat-row">
          <div class="stat-label">
            合計株数
          </div>
          <div class="stat-value" id="totalShares">—</div>
        </div>

      </div>
    </div>

    <button class="reset-btn" onclick="reset()">リセット</button>
  </div>

  <p class="footer-note">※ 税金・手数料は含みません</p>

</div>

<script>
  function fmt(n, digits = 0) {
    return n.toLocaleString('ja-JP', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  function pnlClass(v) {
    if (v > 0) return 'pnl-positive';
    if (v < 0) return 'pnl-negative';
    return '';
  }

  function chipClass(v) {
    if (v > 0) return 'up';
    if (v < 0) return 'down';
    return 'neutral';
  }

  function calculate() {
    const holdShares   = parseFloat(document.getElementById('holdShares').value);
    const avgCost      = parseFloat(document.getElementById('avgCost').value);
    const currentPrice = parseFloat(document.getElementById('currentPrice').value);
    const buyShares    = parseFloat(document.getElementById('buyShares').value);
    const limitPrice   = parseFloat(document.getElementById('limitPrice').value);

    if ([holdShares, avgCost, currentPrice, buyShares, limitPrice].some(isNaN) ||
        [holdShares, avgCost, currentPrice, buyShares, limitPrice].some(v => v < 0)) {
      alert('すべての項目を正しく入力してください。');
      return;
    }

    // 買い増し前
    const beforeCost   = holdShares * avgCost;
    const beforeValue  = holdShares * currentPrice;
    const beforePnl    = beforeValue - beforeCost;
    const beforePnlPct = beforeCost > 0 ? (beforePnl / beforeCost) * 100 : 0;

    // 買い増し後
    const totalShares  = holdShares + buyShares;
    const addCost      = buyShares * limitPrice;
    const newTotalCost = beforeCost + addCost;
    const newAvgCost   = totalShares > 0 ? newTotalCost / totalShares : 0;
    const afterValue   = totalShares * currentPrice;
    const afterPnl     = afterValue - newTotalCost;
    const afterPnlPct  = newTotalCost > 0 ? (afterPnl / newTotalCost) * 100 : 0;

    // 表示
    const bpEl = document.getElementById('beforePnl');
    bpEl.textContent = (beforePnl >= 0 ? '+' : '') + fmt(beforePnl) + ' 円';
    bpEl.className = 'stat-value large ' + pnlClass(beforePnl);

    const bpRateEl = document.getElementById('beforePnlRate');
    bpRateEl.textContent = (beforePnlPct >= 0 ? '+' : '') + fmt(beforePnlPct, 2) + '%';
    bpRateEl.className = 'change-chip ' + chipClass(beforePnl);

    document.getElementById('newAvgCost').textContent = fmt(newAvgCost, 2) + ' 円';

    document.getElementById('totalCost').textContent = fmt(newTotalCost) + ' 円';

    const apEl = document.getElementById('afterPnl');
    apEl.textContent = (afterPnl >= 0 ? '+' : '') + fmt(afterPnl) + ' 円';
    apEl.className = 'stat-value large ' + pnlClass(afterPnl);

    const apRateEl = document.getElementById('afterPnlRate');
    apRateEl.textContent = (afterPnlPct >= 0 ? '+' : '') + fmt(afterPnlPct, 2) + '%';
    apRateEl.className = 'change-chip ' + chipClass(afterPnl);

    document.getElementById('breakEven').textContent = fmt(newAvgCost, 2) + ' 円';
    document.getElementById('totalShares').textContent = fmt(totalShares) + ' 株';

    const results = document.getElementById('results');
    results.classList.remove('visible');
    void results.offsetWidth; // reflow for re-animation
    results.classList.add('visible');

    results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function reset() {
    ['holdShares','avgCost','currentPrice','buyShares','limitPrice'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('results').classList.remove('visible');
  }

  // Enter key to calculate
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') calculate();
  });
</script>
</body>
</html>
