<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA収束ブレイクアウト スクリーナー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:20px;font-weight:600;margin-bottom:1.5rem}
.card{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:1.25rem 1.5rem;margin-bottom:1.25rem}
h2{font-size:15px;font-weight:600;margin-bottom:1rem}
.status-bar{font-size:13px;padding:.6rem 1rem;border-radius:8px;margin-bottom:1rem}
.ok{background:#e8f5e0;color:#2d6a0a}
.err{background:#fce8e8;color:#a32d2d}
.loading{background:#f0f0f0;color:#666}
.params-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1rem}
.param-card{background:#f8f8f8;border-radius:8px;padding:.75rem 1rem;border:1px solid #ebebeb}
.param-label{font-size:11px;color:#888;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.param-val{font-size:22px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
input[type=range]{width:100%;accent-color:#378ADD}
.checks{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.checks label{font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;padding:.5rem .75rem;background:#f8f8f8;border-radius:8px;border:1px solid #ebebeb}
.run-btn{width:100%;padding:.7rem;font-size:15px;font-weight:600;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer}
.run-btn:hover{opacity:.85}
.run-btn:disabled{background:#bbb;cursor:not-allowed}
.status{font-size:13px;color:#666;margin-top:.5rem}
.progress-bar{height:5px;background:#e5e5e5;border-radius:3px;overflow:hidden;margin:.5rem 0;display:none}
.progress-fill{height:100%;background:#378ADD;width:0%;transition:width .05s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
.chip{font-size:12px;background:#f0f0f0;padding:3px 12px;border-radius:20px;color:#555}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:11px;font-weight:600;color:#888;text-align:left;padding:7px 10px;border-bottom:1px solid #e5e5e5;text-transform:uppercase;white-space:nowrap}
tbody tr:hover{background:#fafafa}
tbody td{padding:8px 10px;border-bottom:1px solid #f0f0f0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600}
.up{background:#e8f5e0;color:#2d6a0a}
.dn{background:#fce8e8;color:#a32d2d}
.neu{background:#f0f0f0;color:#666}
.chk{font-size:12px;padding:2px 6px;border-radius:4px;font-weight:600}
.pass{background:#e8f5e0;color:#2d6a0a}
.fail{background:#fce8e8;color:#a32d2d}
.empty{text-align:center;padding:3rem;color:#aaa;font-size:14px}
.warn{font-size:12px;color:#999;margin-top:1rem;padding-top:.75rem;border-top:1px solid #f0f0f0;line-height:1.7}
.mini{display:inline-flex;align-items:flex-end;gap:1px;height:32px;vertical-align:middle}
.back-link{font-size:13px;color:#378ADD;text-decoration:none;display:inline-block;margin-bottom:1rem}
.score-bar{display:inline-block;height:8px;border-radius:4px;background:#378ADD;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<div class="wrap">
<a href="index.html" class="back-link">← トップへ戻る</a>
<h1>📈 MA収束ブレイクアウト スクリーナー</h1>

<div id="statusBar" class="card status-bar loading">⏳ データを読み込み中...</div>

<div class="card">
  <h2>⚙️ パラメーター設定</h2>
  <div class="params-grid">
    <div class="param-card">
      <div class="param-label">MA収束幅（%以内）</div>
      <div class="param-val" id="conv-val">3.0</div>
      <input type="range" min="1" max="10" step="0.5" value="3" id="convPct"
        oninput="document.getElementById('conv-val').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <div class="param-card">
      <div class="param-label">MA上向き判定（日）</div>
      <div class="param-val" id="slope-val">3</div>
      <input type="range" min="1" max="10" value="3" id="slopeDays"
        oninput="document.getElementById('slope-val').textContent=this.value">
    </div>
    <div class="param-card">
      <div class="param-label">収束期間（日以上）</div>
      <div class="param-val" id="convdays-val">5</div>
      <input type="range" min="1" max="20" value="5" id="convDays"
        oninput="document.getElementById('convdays-val').textContent=this.value">
    </div>
    <div class="param-card">
      <div class="param-label">ブレイク遡り（日以内）</div>
      <div class="param-val" id="lookback-val">3</div>
      <input type="range" min="1" max="10" value="3" id="lookback"
        oninput="document.getElementById('lookback-val').textContent=this.value">
    </div>
  </div>

  <div class="checks">
    <label><input type="checkbox" id="chkConv" checked>
      SMA20・SMA60・SMA100が収束している（3本の最大差が株価の指定%以内）</label>
    <label><input type="checkbox" id="chkBreak" checked>
      株価が3本の移動平均線を上抜く（陽線でブレイク）</label>
    <label><input type="checkbox" id="chkCross" checked>
      SMA20がSMA60・SMA100を上抜き始める（ゴールデンクロス系）</label>
    <label><input type="checkbox" id="chkSlope" checked>
      3本のMAが上向きに転換（直近N日で傾きがプラス）</label>
    <label><input type="checkbox" id="chkVol">
      出来高増加（直近5日平均 ＞ 過去20日平均）</label>
  </div>

  <button class="run-btn" id="runBtn" disabled onclick="runScreen()">▶ スクリーニング実行</button>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status" id="statusText"></div>
</div>

<div class="card" id="resultCard" style="display:none">
  <div class="chips" id="chips"></div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>#</th><th>銘柄</th><th>株価</th><th>SMA20</th><th>SMA60</th><th>SMA100</th>
        <th>収束幅</th><th>直近足</th><th>収束</th><th>ブレイク</th><th>GC</th><th>上向き</th><th>出来高</th><th>スコア</th>
      </tr></thead>
      <tbody id="resultTb"></tbody>
    </table>
  </div>
  <p class="warn">⚠️ 過去データの統計分析です。将来の値動きを保証するものではありません。投資判断はご自身の責任で。</p>
</div>

<div id="emptyCard" class="card empty" style="display:none">
  <div style="font-size:36px;margin-bottom:.5rem">🔍</div>
  <p>条件に合う銘柄が見つかりませんでした。<br>収束幅を広げるか、条件を緩めてください。</p>
</div>
</div>

<script>
let rawData = null;

async function loadData() {
  const bar = document.getElementById('statusBar');
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    rawData = await res.json();
    if (!rawData.data || rawData.data.length === 0) throw new Error('データが空です');
    bar.className = 'card status-bar ok';
    bar.textContent = `✅ ${rawData.ticker_count}銘柄 読み込み完了（更新: ${rawData.run_time}）`;
    document.getElementById('runBtn').disabled = false;
  } catch(e) {
    bar.className = 'card status-bar err';
    bar.textContent = `❌ ${e.message}`;
  }
}
loadData();

function sma(arr, n) {
  if (arr.length < n) return null;
  return arr.slice(-n).reduce((a,b) => a+b, 0) / n;
}

function smaSlope(arr, n, days) {
  if (arr.length < n + days) return null;
  const now = arr.slice(-(n)).reduce((a,b)=>a+b,0)/n;
  const past = arr.slice(-(n+days), -days).reduce((a,b)=>a+b,0)/n;
  return now - past;
}

function avgVol(arr, n) {
  if (arr.length < n) return null;
  return arr.slice(-n).reduce((a,b)=>a+b,0)/n;
}

function runScreen() {
  if (!rawData) return;
  const convPct   = parseFloat(document.getElementById('convPct').value) / 100;
  const slopeDays = parseInt(document.getElementById('slopeDays').value);
  const convDays  = parseInt(document.getElementById('convDays').value);
  const lookback  = parseInt(document.getElementById('lookback').value);
  const chkConv   = document.getElementById('chkConv').checked;
  const chkBreak  = document.getElementById('chkBreak').checked;
  const chkCross  = document.getElementById('chkCross').checked;
  const chkSlope  = document.getElementById('chkSlope').checked;
  const chkVol    = document.getElementById('chkVol').checked;

  document.getElementById('runBtn').disabled = true;
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('emptyCard').style.display = 'none';

  const results = [];
  const data = rawData.data;

  for (let di = 0; di < data.length; di++) {
    const d = data[di];
    document.getElementById('progressFill').style.width = (di/data.length*100)+'%';

    const closes = d.closes;
    const N = closes.length;
    if (N < 110) continue;

    const latest = closes[N-1];
    const ma20  = sma(closes, 20);
    const ma60  = sma(closes, 60);
    const ma100 = sma(closes, 100);
    if (!ma20 || !ma60 || !ma100) continue;

    // ① 収束判定：3本MAの最大差が株価のX%以内が連続convDays日
    const maMax = Math.max(ma20, ma60, ma100);
    const maMin = Math.min(ma20, ma60, ma100);
    const convWidth = (maMax - maMin) / latest;
    const isConvNow = convWidth <= convPct;

    // 収束が続いていたか確認
    let convStreak = 0;
    for (let i = 1; i <= convDays + 5; i++) {
      if (N - i < 110) break;
      const c = closes.slice(0, N - i + 1);
      const m20 = c.slice(-20).reduce((a,b)=>a+b,0)/20;
      const m60 = c.slice(-60).reduce((a,b)=>a+b,0)/60;
      const m100 = c.slice(-100).reduce((a,b)=>a+b,0)/100;
      const mx = Math.max(m20,m60,m100);
      const mn = Math.min(m20,m60,m100);
      if ((mx-mn)/c[c.length-1] <= convPct) convStreak++;
      else break;
    }
    const wasConverging = convStreak >= convDays;

    // ② ブレイクアウト判定：直近lookback日以内に陽線で3本MA全てを上抜いた
    let breakIdx = -1;
    let isYosen = false;
    for (let i = 0; i < lookback; i++) {
      const idx = N - 1 - i;
      if (idx < 110) break;
      const c = closes.slice(0, idx + 1);
      const m20 = c.slice(-20).reduce((a,b)=>a+b,0)/20;
      const m60 = c.slice(-60).reduce((a,b)=>a+b,0)/60;
      const m100 = c.slice(-100).reduce((a,b)=>a+b,0)/100;
      const price = c[c.length-1];
      const prevPrice = c[c.length-2];
      // 3本全て上抜き & 陽線
      if (price > m20 && price > m60 && price > m100 && price > prevPrice) {
        // 前日は少なくとも1本以下だった
        const pm20 = c.slice(-21,-1).reduce((a,b)=>a+b,0)/20;
        const pm60 = c.slice(-61,-1).reduce((a,b)=>a+b,0)/60;
        const pm100 = c.slice(-101,-1).reduce((a,b)=>a+b,0)/100;
        if (prevPrice <= pm20 || prevPrice <= pm60 || prevPrice <= pm100) {
          breakIdx = i;
          isYosen = true;
          break;
        }
      }
    }
    const isBreak = breakIdx >= 0;

    // ③ MA20がMA60・MA100を上抜き始める（直近でクロス）
    let isCross = false;
    for (let i = 0; i < lookback + 3; i++) {
      const idx = N - 1 - i;
      if (idx < 110) break;
      const c = closes.slice(0, idx + 1);
      const m20 = c.slice(-20).reduce((a,b)=>a+b,0)/20;
      const m60 = c.slice(-60).reduce((a,b)=>a+b,0)/60;
      const m100 = c.slice(-100).reduce((a,b)=>a+b,0)/100;
      const pm20 = c.slice(-21,-1).reduce((a,b)=>a+b,0)/20;
      const pm60 = c.slice(-61,-1).reduce((a,b)=>a+b,0)/60;
      const pm100 = c.slice(-101,-1).reduce((a,b)=>a+b,0)/100;
      if ((m20 > m60 && pm20 <= pm60) || (m20 > m100 && pm20 <= pm100)) {
        isCross = true;
        break;
      }
    }

    // ④ 3本MAが上向き
    const slope20  = smaSlope(closes, 20, slopeDays);
    const slope60  = smaSlope(closes, 60, slopeDays);
    const slope100 = smaSlope(closes, 100, slopeDays);
    const isSlope = slope20 > 0 && slope60 > 0 && slope100 > 0;

    // ⑤ 出来高（closesにvolumeがないため省略、チェックOFFを推奨）
    // 出来高判定
    const vols = d.volumes || [];
    let isVol = true;
    if (vols.length >= 20) {
      const avg5  = vols.slice(-5).reduce((a,b)=>a+b,0)/5;
      const avg20 = vols.slice(-20).reduce((a,b)=>a+b,0)/20;
      isVol = avg5 > avg20;
    }

    // フィルタリング
    if (chkConv  && !isConvNow) continue;
    if (chkBreak && !isBreak) continue;
    if (chkCross && !isCross) continue;
    if (chkSlope && !isSlope) continue;

    // スコア計算（条件を満たすほど高い）
    let score = 0;
    if (isConvNow) score += 25;
    if (wasConverging) score += 15;
    if (isBreak) score += 30;
    if (breakIdx === 0) score += 10; // 当日ブレイク
    if (isCross) score += 20;
    if (isSlope) score += 20;

    results.push({
      ticker: d.ticker,
      latest, ma20, ma60, ma100,
      convWidth: (convWidth * 100).toFixed(2),
      isConvNow, wasConverging, isBreak, isCross, isSlope, isVol,
      breakDaysAgo: breakIdx,
      score,
      recentPrices: closes.slice(-20),
    });
  }

  results.sort((a, b) => b.score - a.score);
  document.getElementById('runBtn').disabled = false;
  document.getElementById('progressBar').style.display = 'none';
  document.getElementById('statusText').textContent =
    `✅ 完了: ${results.length}銘柄が条件を満たしました`;

  if (!results.length) {
    document.getElementById('emptyCard').style.display = 'block';
    return;
  }

  document.getElementById('chips').innerHTML = [
    `<span class="chip">更新: ${rawData.run_time}</span>`,
    `<span class="chip">対象: ${rawData.ticker_count}銘柄</span>`,
    `<span class="chip">該当: ${results.length}銘柄</span>`,
  ].join('');

  const chk = v => v
    ? '<span class="chk pass">✓</span>'
    : '<span class="chk fail">✗</span>';

  function mini(prices) {
    const mn=Math.min(...prices), mx=Math.max(...prices), rng=mx-mn||1;
    return '<span class="mini">'+prices.map((p,i)=>{
      const h=Math.max(2,Math.round((p-mn)/rng*28));
      const c=i>0&&p>=prices[i-1]?'#2d6a0a':'#a32d2d';
      return `<span style="display:inline-block;width:4px;height:${h}px;background:${c};border-radius:1px 1px 0 0"></span>`;
    }).join('')+'</span>';
  }

  document.getElementById('resultTb').innerHTML = results.map((r,i) => {
    const sc = Math.min(120, r.score);
    const breakLabel = r.breakDaysAgo === 0 ? '<span class="badge up">当日</span>'
      : r.breakDaysAgo > 0 ? `<span class="badge neu">${r.breakDaysAgo}日前</span>`
      : '<span class="badge dn">なし</span>';
    return `<tr>
      <td style="color:#aaa">${i+1}</td>
      <td style="font-weight:600">${r.ticker}</td>
      <td>${r.latest.toLocaleString()}</td>
      <td style="color:#666">${r.ma20.toFixed(1)}</td>
      <td style="color:#666">${r.ma60.toFixed(1)}</td>
      <td style="color:#666">${r.ma100.toFixed(1)}</td>
      <td>${r.convWidth}%</td>
      <td>${mini(r.recentPrices)}</td>
      <td>${chk(r.isConvNow)}</td>
      <td>${breakLabel}</td>
      <td>${chk(r.isCross)}</td>
      <td>${chk(r.isSlope)}</td>
      <td>${chk(r.isVol)}</td>
      <td><span class="score-bar" style="width:${sc}px"></span>${sc}</td>
    </tr>`;
  }).join('');

  document.getElementById('resultCard').style.display = 'block';
}
</script>
</body>
</html>
