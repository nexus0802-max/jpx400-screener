name: Screener v2 Phase1 Test (Manual)

on:
  workflow_dispatch:

jobs:
  run-screener-v2-phase1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install yfinance pandas numpy
      - name: run phase1 script
        run: python screener_v2_phase3.py
      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data_v2_phase3.json
          git diff --staged --quiet || git commit -m "test: screener v2 phase1 data"
          git push origin main || (
            git pull origin main --no-rebase -X ours &&
            git push origin main
          )
